# DO NOT EDIT — regenerate with `cargo x workflows` (from the repository root).
# Source: tooling/xtask/crates/xtask_workflows/src/workflows/build_staging_clients.rs
name: Build staging clients
'on':
  workflow_dispatch:
    inputs:
      component:
        description: web, lexical-service, sync-service, or all (private synthetic pilot)
        required: true
        type: string
        default: all
permissions:
  contents: read
  packages: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
    - name: Validate client selection
      run: |
        set -euo pipefail
        case "$COMPONENT" in web|lexical-service|sync-service|all) ;; *) exit 1 ;; esac
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.13'
    - name: Validate workflows on Linux
      run: |
        set -euo pipefail
        rustup toolchain install 1.94.0 --profile minimal
        cargo +1.94.0 run --locked -p xtask_workflows -- --check
        cargo +1.94.0 test --locked -p xtask_workflows
      shell: bash
  web:
    needs:
    - validate
    if: ${{ inputs.component == 'all' || inputs.component == 'web' }}
    name: Build web
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Prepare web build tools
      uses: './.github/actions/setup-reqs-web'
    - name: Build same-origin private pilot web app
      run: |
        set -euo pipefail
        # dev:prepare builds the required WASM packages sequentially.
        bun run dev:prepare
        bun run --bun build
        test -s dist/index.html
      shell: bash
      env:
        CARGO_BUILD_JOBS: '2'
        NODE_OPTIONS: '--max-old-space-size=4096'
        MODE: development
        NODE_ENV: production
        VITE_LOCAL_SERVERS: ALL
        VITE_LOCAL_BACKEND_ORIGIN: same-origin
        VITE_LOCAL_ONLY: 'true'
        VITE_LOCAL_STACK: 'true'
        VITE_AI_EDITING_WORKER_URL: /ai-editing
        VITE_SEGMENT_WRITE_KEY: ''
        VITE_POSTHOG_API_KEY: ''
        VITE_OTEL_EXPORTER_URL: ''
      working-directory: apps/web
    - name: Build client image
      run: |
        set -euo pipefail
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        image="ghcr.io/${owner}/macro-${COMPONENT}:${GITHUB_SHA}"
        docker build -f "$DOCKERFILE" \
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$image" .
      shell: bash
      env:
        COMPONENT: web
        DOCKERFILE: docker/Dockerfile.staging-web
    - name: Publish client image
      run: |
        set -euo pipefail
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        image="ghcr.io/${owner}/macro-${COMPONENT}:${GITHUB_SHA}"
        trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
        printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker push "$image"
        docker inspect --format '{{join .RepoDigests "\n"}}' "$image" >> "$GITHUB_STEP_SUMMARY"
      shell: bash
      env:
        COMPONENT: web
        REGISTRY_TOKEN: ${{ github.token }}
  lexical-service:
    needs:
    - validate
    if: ${{ inputs.component == 'all' || inputs.component == 'lexical-service' }}
    name: Build lexical-service
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
    - name: Build client image
      run: |
        set -euo pipefail
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        image="ghcr.io/${owner}/macro-${COMPONENT}:${GITHUB_SHA}"
        docker build -f "$DOCKERFILE" \
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$image" .
      shell: bash
      env:
        COMPONENT: lexical-service
        DOCKERFILE: docker/lexical-service.Dockerfile
    - name: Publish client image
      run: |
        set -euo pipefail
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        image="ghcr.io/${owner}/macro-${COMPONENT}:${GITHUB_SHA}"
        trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
        printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker push "$image"
        docker inspect --format '{{join .RepoDigests "\n"}}' "$image" >> "$GITHUB_STEP_SUMMARY"
      shell: bash
      env:
        COMPONENT: lexical-service
        REGISTRY_TOKEN: ${{ github.token }}
  sync-service:
    needs:
    - validate
    if: ${{ inputs.component == 'all' || inputs.component == 'sync-service' }}
    name: Build sync-service
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
    - name: Checkout Repo
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      with:
        persist-credentials: 'false'
    - name: Build client image
      run: |
        set -euo pipefail
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        image="ghcr.io/${owner}/macro-${COMPONENT}:${GITHUB_SHA}"
        docker build -f "$DOCKERFILE" \
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$image" .
      shell: bash
      env:
        COMPONENT: sync-service
        DOCKERFILE: docker/sync-service.Dockerfile
    - name: Publish client image
      run: |
        set -euo pipefail
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        image="ghcr.io/${owner}/macro-${COMPONENT}:${GITHUB_SHA}"
        trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
        printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker push "$image"
        docker inspect --format '{{join .RepoDigests "\n"}}' "$image" >> "$GITHUB_STEP_SUMMARY"
      shell: bash
      env:
        COMPONENT: sync-service
        REGISTRY_TOKEN: ${{ github.token }}
concurrency:
  group: staging-clients-${{ github.repository }}
  cancel-in-progress: false
