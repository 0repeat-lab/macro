      name: Validate service selection
      run: |
        set -euo pipefail
        case "$COMPONENT" in
          authentication-service|connection-gateway|contacts-service|document-storage-service|notification-service|search-processing-service|email-service|calendar-service|static-file-service|image-proxy-service|unfurl-service|task-services) ;;
          *) echo 'Unsupported staging service' >&2; exit 1 ;;
        esac
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
    - name: Setup Bun
      uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
      with:
        bun-version: '1.3.13'
    - name: Validate workflows on Linux
      run: |
        set -euo pipefail
        rustup toolchain install 1.94.0 --profile minimal
        cargo +1.94.0 run --locked -p xtask_workflows -- --check
        cargo +1.94.0 test --locked -p xtask_workflows
      shell: bash
    - name: Setup Nix
      uses: './.github/actions/setup-nix'
    - name: Build authentication-service
      if: ${{ inputs.component == 'authentication-service' || (inputs.component == 'task-services' && false) }}
      run: |
        set -euo pipefail
        test ! -e prebuilt
        nix build --max-jobs 1 --cores 2 --print-build-logs ".#${NIX_TARGET}"
        mkdir -p prebuilt/nix-store
        cp -r result/bin/* prebuilt/
        nix-store -qR result > runtime-closure.txt
        while IFS= read -r store_path; do
          cp -a "$store_path" prebuilt/nix-store/
        done < runtime-closure.txt
      shell: bash
      env:
        NIX_TARGET: deploy-service-binaries-authentication-service
    - name: Publish authentication-service
      if: ${{ inputs.component == 'authentication-service' || (inputs.component == 'task-services' && false) }}
      run: |
        set -euo pipefail
        owner="${GITHUB_REPOSITORY_OWNER,,}"
        image="ghcr.io/${owner}/macro-${COMPONENT}:${GITHUB_SHA}"
        trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
        printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        docker build -f docker/Dockerfile.prebuilt --build-arg "SERVICE_NAME=$BINARY" \
          --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
          --label "org.opencontainers.image.revision=${GITHUB_SHA}" -t "$image" .
        docker push "$image"
        docker inspect --format '{{join .RepoDigests "\n"}}' "$image" >> "$GITHUB_STEP_SUMMARY"
        chmod -R u+w prebuilt
        rm -rf -- prebuilt runtime-closure.txt
      shell: bash
      env:
        COMPONENT: authentication-service
        BINARY: authentication_service
        REGISTRY_TOKEN: ${{ github.token }}
